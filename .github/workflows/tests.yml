name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:        # reused as the first stage of build-and-deploy.yml

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Light deps only: the API tests swap the retriever for an in-memory
      # fake, so no torch / models / indexes are needed here.
      - name: Install test dependencies
        run: pip install pytest python-dotenv fastapi httpx

      - name: Run unit tests
        run: pytest tests/ -v
